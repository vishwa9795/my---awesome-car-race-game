<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Velocity rush — 3D racing</title></head><body style='margin:0;background:#14181f;display:flex;align-items:center;justify-content:center;min-height:100vh'>
<style>
.vr-wrap{font-family:var(--kimi-font-sans, sans-serif);width:100%;}
.vr-wrap button{font:inherit;}
.vr-stage{position:relative;width:min(100%, calc(72vh * 16 / 9));aspect-ratio:16/9;margin:0 auto;border-radius:12px;overflow:hidden;background:#0b1220;box-shadow:0 4px 24px rgba(0,0,0,.25);}
canvas{display:block;width:100%;height:100%;}
.vr-hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;}
.vr-chip{background:rgba(10,14,20,.55);color:#fff;border-radius:10px;padding:4px 12px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.vr-speed{font-size:28px;font-weight:500;line-height:1.15;}
.vr-speed small{font-size:12px;font-weight:400;opacity:.75;margin-left:2px;}
.vr-meta{font-size:14px;line-height:28px;}
.vr-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,12,18,.5);}
.vr-panel{background:rgba(12,16,24,.9);color:#fff;border-radius:12px;padding:20px 32px;text-align:center;max-width:82%;}
.vr-panel h1{margin:0 0 8px;font-size:22px;font-weight:500;letter-spacing:0;}
.vr-panel p{margin:4px 0;font-size:14px;opacity:.85;line-height:1.5;}
.vr-btn{margin-top:14px;background:#fff;color:#14181f;border:none;border-radius:10px;padding:10px 28px;font-size:15px;font-weight:500;cursor:pointer;}
.vr-btn:active{opacity:.8;}
.vr-controls{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;}
.vr-cluster{display:flex;gap:10px;pointer-events:auto;}
.vr-ctl{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;}
.vr-ctl:active{background:rgba(255,255,255,.34);}
</style>
<div class="vr-wrap">
 <div class="vr-stage">
  <canvas id="vrCanvas" width="960" height="540"></canvas>
  <div class="vr-hud">
   <div class="vr-chip vr-speed"><span id="vrSpd">0</span><small>km/h</small></div>
   <div class="vr-chip vr-meta" id="vrTime">0:00.0</div>
   <div class="vr-chip vr-meta"><span id="vrPos">P6/6</span> · <span id="vrLap">Lap 1/3</span></div>
  </div>
  <div class="vr-overlay" id="vrOv">
   <div class="vr-panel" id="vrPanel"></div>
  </div>
  <div class="vr-controls">
   <div class="vr-cluster">
    <button class="vr-ctl" id="vrL">&#9664;</button>
    <button class="vr-ctl" id="vrR">&#9654;</button>
   </div>
   <div class="vr-cluster">
    <button class="vr-ctl" id="vrB">&#9660;</button>
    <button class="vr-ctl" id="vrG">&#9650;</button>
   </div>
  </div>
 </div>
</div>
<script>
(function(){
var cv=document.getElementById('vrCanvas'),ctx=cv.getContext('2d');
var W=960,H=540;
function tk(n,f){try{var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}catch(e){return f;}}
var COL={
 sky1:'#79b5dd',sky2:'#dcedf2',fog:'#d5e8ef',
 grassA:'#82b657',grassB:'#76a84e',
 roadA:'#696b71',roadB:'#717378',
 rumA:'#ededed',rumB:'#c14b42',lane:'#e9e9e9',
 player:tk('--kimi-color-accent','#2f6fed'),
 cars:[tk('--kimi-chart-2','#cf4b45'),tk('--kimi-chart-3','#3f9e58'),tk('--kimi-chart-4','#8a63c9'),tk('--kimi-chart-5','#8a8f98'),tk('--kimi-chart-1','#3f7fd6')]
};
var segLen=200,rumble=3,lanes=3,roadW=2100,camH=1080,fov=100;
var camDepth=1/Math.tan(fov/2*Math.PI/180),playerZ=camH*camDepth;
var drawDist=260,fogDensity=5,centrifugal=0.32,totalLaps=3;
var maxSpeed=segLen*52,accel=maxSpeed/4.5,brake=maxSpeed/1.6,decel=maxSpeed/6,offRoadDecel=maxSpeed/1.8,offRoadLimit=maxSpeed/3;
function lerp(a,b,t){return a+(b-a)*t;}
function inc(v,amt,max){v+=amt;while(v>=max)v-=max;while(v<0)v+=max;return v;}
var segments=[],trackLength=0;
function lastY(){return segments.length?segments[segments.length-1].p2.world.y:0;}
function addSegment(curve,y){var n=segments.length;segments.push({index:n,curve:curve,sprites:[],fog:1,clip:0,looped:false,
 p1:{world:{x:0,y:lastY(),z:n*segLen},camera:{},screen:{}},
 p2:{world:{x:0,y:y,z:(n+1)*segLen},camera:{},screen:{}}});}
function easeIn(a,b,p){return a+(b-a)*p*p;}
function easeInOut(a,b,p){return a+(b-a)*(-Math.cos(p*Math.PI)/2+0.5);}
function addRoad(e,h,l,curve,y){var s=lastY(),t=e+h+l,n;
 for(n=0;n<e;n++)addSegment(easeIn(0,curve,n/e),easeInOut(s,y,n/t));
 for(n=0;n<h;n++)addSegment(curve,easeInOut(s,y,(e+n)/t));
 for(n=0;n<l;n++)addSegment(easeInOut(curve,0,n/l),easeInOut(s,y,(e+h+n)/t));}
function buildTrack(){
 addRoad(40,80,40,0,0);
 addRoad(60,80,60,2.2,0);
 addRoad(60,90,60,-3,22);
 addRoad(40,60,40,0,-14);
 addRoad(60,80,60,-2.4,0);
 addRoad(60,80,60,3.2,-26);
 addRoad(45,45,45,-4.2,0);
 addRoad(45,45,45,4.2,0);
 addRoad(80,120,80,0,-34);
 addRoad(60,90,60,3,0);
 addRoad(50,90,50,0,16);
 trackLength=segments.length*segLen;
}
function addSprites(){var n;
 for(n=10;n<segments.length;n+=5){
  var seg=segments[n];
  if(n%4===0)seg.sprites.push({type:'tree',off:1.7+Math.random()*1.1});
  if(n%4===2)seg.sprites.push({type:'tree',off:-1.7-Math.random()*1.1});
  if(n%9===0)seg.sprites.push({type:'pole',off:-1.35});
  if(n%13===0)seg.sprites.push({type:'rock',off:2.6+Math.random()*0.8});
 }}
var cars=[];
function resetCars(){cars=[];var i;
 var speeds=[0.97,0.93,0.90,0.87,0.84],offs=[-0.55,0.3,-0.15,0.6,0.0],zs=[1400,3000,4800,6800,8800];
 for(i=0;i<5;i++)cars.push({z:zs[i],off:offs[i],speed:maxSpeed*speeds[i],total:zs[i],seed:Math.random()*10,color:COL.cars[i]});}
var position=0,playerX=0,speed=0,totalDist=0,raceTime=0,lapStart=0,lastLap=0,bestLap=0,lap=1;
var state='menu',countT=0,goFlash=0,playerTilt=0;
var keys={left:false,right:false,up:false,down:false};
function findSegment(z){z=inc(z,0,trackLength);return segments[Math.floor(z/segLen)];}
function project(p,camX,camY,camZ){
 p.camera.x=(p.world.x||0)-camX;
 p.camera.y=p.world.y-camY;
 p.camera.z=p.world.z-camZ;
 p.screen.scale=camDepth/p.camera.z;
 p.screen.x=Math.round(W/2+p.screen.scale*p.camera.x*W/2);
 p.screen.y=Math.round(H/2-p.screen.scale*p.camera.y*H/2);
 p.screen.w=Math.round(p.screen.scale*roadW*W/2);}
function poly(x1,y1,x2,y2,w1,w2,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x2-w2,y2);ctx.lineTo(x2+w2,y2);ctx.lineTo(x1+w1,y1);ctx.closePath();ctx.fill();}
function drawSegment(seg,light){
 var p1=seg.p1.screen,p2=seg.p2.screen;
 ctx.fillStyle=light?COL.grassA:COL.grassB;
 ctx.fillRect(0,p2.y,W,p1.y-p2.y+1);
 var r1=p1.w/Math.max(6,2*lanes),r2=p2.w/Math.max(6,2*lanes);
 poly(p1.x,p1.y,p2.x,p2.y,p1.w+r1,p2.w+r2,light?COL.rumA:COL.rumB);
 poly(p1.x,p1.y,p2.x,p2.y,p1.w,p2.w,light?COL.roadA:COL.roadB);
 if(light){
  var l1=p1.w*2/lanes,l2=p2.w*2/lanes;
  var lw1=Math.max(1,p1.w/28),lw2=Math.max(1,p2.w/28),l,lx1,lx2;
  for(l=1;l<lanes;l++){lx1=p1.x-p1.w+l1*l;lx2=p2.x-p2.w+l2*l;poly(lx1,p1.y,lx2,p2.y,lw1,lw2,COL.lane);}
 }
 var fogA=1-seg.fog;
 if(fogA>0.01){ctx.globalAlpha=Math.min(1,fogA);ctx.fillStyle=COL.fog;ctx.fillRect(0,p2.y,W,p1.y-p2.y+1);ctx.globalAlpha=1;}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();}
function drawCar(cx,cy,w,color,tilt){
 var h=w*0.5;
 ctx.save();ctx.translate(cx,cy);ctx.rotate(tilt||0);
 ctx.fillStyle='rgba(0,0,0,0.28)';
 ctx.beginPath();ctx.ellipse(0,h*0.34,w*0.52,h*0.13,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#15181c';
 rr(-w*0.47,h*0.02,w*0.16,h*0.3,w*0.05);rr(w*0.31,h*0.02,w*0.16,h*0.3,w*0.05);
 ctx.fillStyle=color;
 rr(-w/2,-h*0.16,w,h*0.44,w*0.12);
 ctx.fillStyle='rgba(255,255,255,0.16)';
 rr(-w*0.34,-h*0.44,w*0.68,h*0.36,w*0.1);
 ctx.fillStyle='#1c2733';
 rr(-w*0.28,-h*0.4,w*0.56,h*0.22,w*0.06);
 ctx.fillStyle='rgba(255,255,255,0.9)';
 rr(-w*0.42,-h*0.08,w*0.12,h*0.07,w*0.03);rr(w*0.3,-h*0.08,w*0.12,h*0.07,w*0.03);
 ctx.restore();}
function tri(cx,topY,halfW,h){ctx.beginPath();ctx.moveTo(cx-halfW,topY+h);ctx.lineTo(cx,topY);ctx.lineTo(cx+halfW,topY+h);ctx.closePath();ctx.fill();}
function drawSprite(spr,cx,cy,rw,n){
 if(spr.type==='tree'){
  var th=rw*0.95;
  ctx.fillStyle='#6b4a2f';ctx.fillRect(cx-rw*0.04,cy-th*0.26,rw*0.08,th*0.26);
  ctx.fillStyle=(n%2===0)?'#3e7a3a':'#356e33';
  tri(cx,cy-th*0.92,th*0.30,th*0.72);
  ctx.fillStyle=(n%2===0)?'#4c8c46':'#417d3d';
  tri(cx,cy-th*0.58,th*0.40,th*0.58);
 }else if(spr.type==='pole'){
  var ph=rw*0.85;
  ctx.strokeStyle='#c9cdd2';ctx.lineWidth=Math.max(1,rw*0.028);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy-ph);ctx.stroke();
  ctx.lineWidth=Math.max(1,rw*0.018);
  ctx.beginPath();ctx.moveTo(cx-rw*0.12,cy-ph*0.9);ctx.lineTo(cx+rw*0.12,cy-ph*0.9);ctx.stroke();
 }else{
  var r=rw*0.24;
  ctx.fillStyle='#8f939a';ctx.beginPath();ctx.ellipse(cx,cy-r*0.4,r,r*0.62,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#a7abb2';ctx.beginPath();ctx.ellipse(cx-r*0.25,cy-r*0.55,r*0.45,r*0.28,0,0,Math.PI*2);ctx.fill();
 }}
function render(){
 var skyG=ctx.createLinearGradient(0,0,0,H*0.55);
 skyG.addColorStop(0,COL.sky1);skyG.addColorStop(1,COL.sky2);
 ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
 var baseSegment=findSegment(position+playerZ);
 var basePercent=(position+playerZ)%segLen/segLen;
 var playerSegment=findSegment(position+playerZ);
 var playerPercent=(position+playerZ)%segLen/segLen;
 var playerY=lerp(playerSegment.p1.world.y,playerSegment.p2.world.y,playerPercent);
 var maxy=H,x=0,dx=-(baseSegment.curve*basePercent),n,segment;
 for(n=0;n<drawDist;n++){
  segment=segments[(baseSegment.index+n)%segments.length];
  segment.looped=segment.index<baseSegment.index;
  segment.fog=Math.exp(-fogDensity*(n/drawDist));
  segment.clip=maxy;
  project(segment.p1,(playerX*roadW)-x,playerY+camH,position-(segment.looped?trackLength:0));
  project(segment.p2,(playerX*roadW)-x-dx,playerY+camH,position-(segment.looped?trackLength:0));
  x+=dx;dx+=segment.curve;
  if(segment.p1.camera.z<=camDepth||segment.p2.screen.y>=segment.p1.screen.y||segment.p2.screen.y>=maxy)continue;
  drawSegment(segment,Math.floor(segment.index/rumble)%2===0);
  maxy=segment.p1.screen.y;
 }
 for(n=drawDist-1;n>0;n--){
  segment=segments[(baseSegment.index+n)%segments.length];
  if(segment.p1.camera.z<=camDepth)continue;
  var i,scale,cx,cy;
  for(i=0;i<segment.sprites.length;i++){
   var spr=segment.sprites[i];
   scale=segment.p1.screen.scale;
   cx=segment.p1.screen.x+scale*(spr.off*roadW)*W/2;
   cy=segment.p1.screen.y;
   if(cy>=segment.clip)continue;
   ctx.globalAlpha=Math.min(1,segment.fog*1.6);
   drawSprite(spr,cx,cy,scale*roadW*W/2,n);
   ctx.globalAlpha=1;
  }
  for(i=0;i<cars.length;i++){
   var car=cars[i];
   if(findSegment(car.z)===segment){
    var cp=(car.z%segLen)/segLen;
    var cs=lerp(segment.p1.screen.scale,segment.p2.screen.scale,cp);
    cx=segment.p1.screen.x+cs*(car.off*roadW)*W/2;
    cy=lerp(segment.p1.screen.y,segment.p2.screen.y,cp);
    if(cy>=segment.clip)continue;
    ctx.globalAlpha=Math.min(1,segment.fog*1.6);
    drawCar(cx,cy,cs*1500*W/2,car.color,0);
    ctx.globalAlpha=1;
   }
  }
 }
 var targetTilt=((keys.right?1:0)-(keys.left?1:0))*0.05*(speed/maxSpeed);
 playerTilt+=(targetTilt-playerTilt)*0.15;
 drawCar(W/2,H-58,W*0.19,COL.player,playerTilt);
 if(state==='count'){var cn=Math.ceil(countT);bigText(cn>0?String(cn):'GO',1);}
 else if(goFlash>0){goFlash-=0.016;bigText('GO',Math.max(0,goFlash));}
}
function bigText(t,a){ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,a));ctx.fillStyle='#fff';ctx.font='500 92px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,0.35)';ctx.shadowBlur=12;ctx.fillText(t,W/2,H*0.38);ctx.restore();}
function update(dt){
 if(state==='count'){
  var prev=Math.ceil(countT);
  countT-=dt;
  var cur=Math.ceil(countT);
  if(cur!==prev&&cur>0)beep(440,0.09);
  if(countT<=0){state='race';goFlash=1;beep(880,0.25);lapStart=raceTime;}
  return;
 }
 if(state!=='race')return;
 raceTime+=dt;
 var speedPct=speed/maxSpeed;
 var dx=dt*1.9*speedPct;
 var playerSegment=findSegment(position+playerZ);
 if(keys.left)playerX-=dx;
 if(keys.right)playerX+=dx;
 playerX-=dx*speedPct*playerSegment.curve*centrifugal;
 if(keys.up)speed+=accel*dt;
 else if(keys.down)speed-=brake*dt;
 else speed-=decel*dt;
 if((playerX<-1.05||playerX>1.05)&&speed>offRoadLimit)speed-=offRoadDecel*dt;
 position=inc(position,speed*dt,trackLength);
 totalDist+=speed*dt;
 var newLap=Math.floor(totalDist/trackLength)+1;
 if(newLap!==lap){
  lap=newLap;
  var lt=raceTime-lapStart;lapStart=raceTime;
  if(lap>1){lastLap=lt;if(!bestLap||lt<bestLap)bestLap=lt;}
  if(lap<=totalLaps)beep(660,0.12);
 }
 var i,car;
 for(i=0;i<cars.length;i++){
  car=cars[i];
  car.z=inc(car.z,car.speed*dt,trackLength);
  car.total+=car.speed*dt;
  car.off+=Math.sin(raceTime*0.6+car.seed)*0.0004;
  if(car.off>0.8)car.off=0.8;if(car.off<-0.8)car.off=-0.8;
  if(speed>car.speed&&findSegment(car.z)===playerSegment&&Math.abs(playerX-car.off)<0.42){
   speed=Math.max(car.speed*0.9,speed*0.4);
   position=inc(car.z,-playerZ,trackLength);
   playerX+=(playerX<car.off?-0.04:0.04);
  }
 }
 if(speed<0)speed=0;if(speed>maxSpeed)speed=maxSpeed;
 if(totalDist>=trackLength*totalLaps)finishRace();
}
function rank(){var r=1,i;for(i=0;i<cars.length;i++)if(cars[i].total>totalDist)r++;return r;}
function fmt(t){if(!t&&t!==0)return '--';var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1);}
var spdEl=document.getElementById('vrSpd'),posEl=document.getElementById('vrPos'),lapEl=document.getElementById('vrLap'),timeEl=document.getElementById('vrTime');
var ov=document.getElementById('vrOv'),panel=document.getElementById('vrPanel');
function showPanel(html){ov.style.display='flex';panel.innerHTML=html;}
function hidePanel(){ov.style.display='none';}
function showMenu(){showPanel('<h1>Velocity rush</h1><p>3 laps &middot; 5 rivals &middot; first to the line wins</p><p style="opacity:.65">Steer &#9664; &#9654; &middot; gas &#9650; &middot; brake &#9660;<br>or use the arrow keys / WASD</p><button class="vr-btn" id="vrStart">Start race</button>');document.getElementById('vrStart').onclick=startRace;}
function resetAll(){position=0;playerX=0;speed=0;totalDist=0;raceTime=0;lap=1;lastLap=0;bestLap=0;lapStart=0;goFlash=0;resetCars();}
function startRace(){resetAll();state='count';countT=3.4;hidePanel();ensureAudio();}
function finishRace(){
 state='done';
 var r=rank(),bl=bestLap||lastLap;
 showPanel('<h1>Race complete</h1><p style="font-size:18px;font-weight:500">Position P'+r+'/6</p><p>Total time: '+fmt(raceTime)+' &middot; Best lap: '+fmt(bl)+'</p><button class="vr-btn" id="vrAgain">Race again</button>');
 document.getElementById('vrAgain').onclick=startRace;
 beep(523,0.15);setTimeout(function(){beep(659,0.15);},170);setTimeout(function(){beep(784,0.3);},340);
}
var actx=null,engine=null;
function ensureAudio(){
 if(actx){if(actx.state==='suspended')actx.resume();return;}
 try{
  actx=new (window.AudioContext||window.webkitAudioContext)();
  var osc=actx.createOscillator();osc.type='sawtooth';
  var flt=actx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=900;
  var g=actx.createGain();g.gain.value=0;
  osc.connect(flt);flt.connect(g);g.connect(actx.destination);osc.start();
  engine={osc:osc,gain:g,flt:flt};
 }catch(e){}
}
function beep(f,d){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.07,actx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
function updateAudio(){
 if(!engine)return;
 var p=speed/maxSpeed;
 engine.osc.frequency.setTargetAtTime(60+p*190+Math.random()*5,actx.currentTime,0.05);
 engine.flt.frequency.setTargetAtTime(500+p*1600,actx.currentTime,0.1);
 engine.gain.gain.setTargetAtTime(state==='race'?0.03+p*0.03:0,actx.currentTime,0.12);
}
window.addEventListener('keydown',function(e){
 var k=e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0)e.preventDefault();
 ensureAudio();
 if(state==='menu'&&(k==='Enter'||k===' ')){startRace();return;}
 if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
 if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
 if(k==='ArrowUp'||k==='w'||k==='W')keys.up=true;
 if(k==='ArrowDown'||k==='s'||k==='S')keys.down=true;
});
window.addEventListener('keyup',function(e){
 var k=e.key;
 if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
 if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
 if(k==='ArrowUp'||k==='w'||k==='W')keys.up=false;
 if(k==='ArrowDown'||k==='s'||k==='S')keys.down=false;
});
function bindBtn(id,prop){
 var el=document.getElementById(id);
 el.addEventListener('pointerdown',function(e){e.preventDefault();ensureAudio();keys[prop]=true;});
 var off=function(e){e.preventDefault();keys[prop]=false;};
 el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);
 el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
bindBtn('vrL','left');bindBtn('vrR','right');bindBtn('vrG','up');bindBtn('vrB','down');
buildTrack();addSprites();resetCars();
var last=performance.now();
function frame(now){
 var dt=Math.min(0.05,(now-last)/1000);last=now;
 update(dt);render();updateAudio();
 spdEl.textContent=Math.round(speed/maxSpeed*300);
 posEl.textContent='P'+rank()+'/6';
 lapEl.textContent=lap>totalLaps?'Done':'Lap '+Math.min(lap,totalLaps)+'/'+totalLaps;
 timeEl.textContent=fmt(raceTime);
 requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body></html>
